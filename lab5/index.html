<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 5 - Багатовіконний графічний редактор</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <nav id="menubar" class="menubar" role="menubar">
            <div class="menu-item dropdown" id="menu-file" role="menuitem" tabindex="0"
                 aria-haspopup="true" aria-expanded="false">
                Файл
                <div class="dropdown-content" id="dropdown-file" role="menu">
                    <button type="button" id="save-csv" role="menuitem">Зберегти CSV</button>
                    <button type="button" id="load-csv" role="menuitem">Завантажити CSV</button>
                    <input id="csv-file" type="file" accept=".csv,text/csv" hidden>
                </div>
            </div>
            <div class="menu-item dropdown" id="menu-objects" role="menuitem" tabindex="0"
                 aria-haspopup="true" aria-expanded="false">
                Об'єкти
                <div class="dropdown-content" id="dropdown-objects" role="menu">
                    <button type="button" data-tool="point" role="menuitem">Крапка</button>
                    <button type="button" data-tool="line" role="menuitem">Лінія</button>
                    <button type="button" data-tool="rect" role="menuitem">Прямокутник</button>
                    <button type="button" data-tool="ellipse" role="menuitem">Еліпс</button>
                    <button type="button" data-tool="dottedLine" role="menuitem">Лінія з кружечками</button>
                    <button type="button" data-tool="cube" role="menuitem">Каркас куба</button>
                </div>
            </div>
            <button class="menu-item menu-button" id="toggle-table" type="button">Таблиця</button>
            <div class="menu-item" role="menuitem" tabindex="0">Довідка</div>
        </nav>

        <div id="toolbar" class="toolbar" role="toolbar" aria-label="Панель інструментів">
            <button class="tool-button active" type="button" data-tool="point" title="Крапка" aria-label="Крапка">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"></circle></svg>
            </button>
            <button class="tool-button" type="button" data-tool="line" title="Лінія" aria-label="Лінія">
                <svg viewBox="0 0 24 24"><line x1="5" y1="19" x2="19" y2="5"></line></svg>
            </button>
            <button class="tool-button" type="button" data-tool="rect" title="Прямокутник" aria-label="Прямокутник">
                <svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12"></rect></svg>
            </button>
            <button class="tool-button" type="button" data-tool="ellipse" title="Еліпс" aria-label="Еліпс">
                <svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8" ry="5"></ellipse></svg>
            </button>
            <button class="tool-button" type="button" data-tool="dottedLine" title="Лінія з кружечками" aria-label="Лінія з кружечками">
                <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line><circle cx="5" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg>
            </button>
            <button class="tool-button" type="button" data-tool="cube" title="Каркас куба" aria-label="Каркас куба">
                <svg viewBox="0 0 24 24"><path d="M5 8l7-4 7 4v8l-7 4-7-4zM5 8l7 4 7-4M12 12v8"></path></svg>
            </button>
        </div>
    </header>

    <main class="workspace">
        <canvas id="editorCanvas" aria-label="Полотно графічного редактора"></canvas>
    </main>
    <script type="module" src="script.js"></script>
</body>
</html>
